name: Bug report
description: Something is broken or behaves differently from what the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Portuguese is fine too.
        **Security problem?** Please do not open a public issue: see [SECURITY.md](https://github.com/efesodavila/Floorwalk/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: I ran `npm run hooks:install`, opened a Claude Code session, and no character came in.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start
        2. Open http://127.0.0.1:8787
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version (`node -v`)
      placeholder: v22.9.0
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
      placeholder: 2.1.0
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140, Firefox 140, Safari 18
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or browser console errors
      description: Anything printed by `npm start`, `npm run hooks:status`, or the browser console. Remove tokens and paths you do not want to share.
      render: text
